target-version = "py37"
line-length = 100
force-exclude = true
# Generated ANTLR modules are formatted by ``make antlr_build`` after each
# build, but remain outside normal source formatting and linting checks.
extend-exclude = [
    "upstream/**",
    "pysysmlv2/syntax/generated/**",
]

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
"pysysmlv2/syntax/generated/*.py" = ["E", "F", "W", "I"]
